<div
  class="flex items-start gap-3 cursor-pointer"
  (click)="selectOption()"
  [attr.role]="'radio'"
  [attr.aria-checked]="checked"
  [ngClass]="{ 'opacity-50 pointer-events-none': disabled }"
>
  <!-- Radio Circle -->
  <div
    class="relative flex items-center justify-center w-6 h-6 border-2 rounded-full"
    [ngClass]="{
      'border-cyan-600 bg-white': checked,
      'border-gray-200 bg-white': !checked,
      'border-gray-200 bg-gray-100': disabled
    }"
  >
    <!-- Smooth Transition for Blue Dot -->
    <div
      class="w-3 h-3 bg-cyan-600 rounded-full transform transition-all duration-300"
      [ngClass]="{
        'opacity-100 scale-100': checked,
        'opacity-0 scale-0': !checked
      }"
    ></div>
  </div>

  <!-- Label and Description -->
  <div>
    <h4 class="text-sm font-semibold text-gray-800">{{ label }}</h4>
    <p *ngIf="description" class="text-sm text-gray-500">{{ description }}</p>
  </div>
</div>
