<div #trigger class="relative w-full flex flex-col gap-y-1">
    <!-- Label -->
  <label *ngIf="label" class="text-xs font-medium text-foreground select-none antialiased">
    {{ label }}
  </label>

  <!-- Trigger Button when search not enabled or when dropdown is closed -->
  <div [class]="innerClasses">
    <div  class="px-2">
      <app-icon *ngIf="icon" [icon]="icon" class="h-3 w-3 text-muted-foreground"></app-icon>
    </div>
    <div *ngIf="!enableSearch || (enableSearch && !isOpen)"
      class="flex items-center justify-between pe-3 sm:py-2 py-1.5 w-full h-full" (click)="toggleDropdown()">
      <span *ngIf="!selectedItem && !loading"
        class="text-gray-600 text-xs w-full text-start select-none flex items-center gap-2">

        {{ placeholder}}
      </span>
      <span *ngIf="!selectedItem && loading" class="flex items-center gap-0.5 text-muted-foreground text-sm">
        <span class="animate-bounce [animation-delay:-0.3s]">.</span>
        <span class="animate-bounce [animation-delay:-0.15s]">.</span>
        <span class="animate-bounce">.</span>
      </span>
      <span *ngIf="selectedItem"
        class="text-foreground font-normal text-xs capitalize w-full text-start select-none flex items-center gap-2">
        {{selectedItem.text }}
      </span>
      <svg class="w-4 h-4 text-gray-500 absolute right-2 transition-all duration-150" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path class="transition-all duration-200" stroke-linecap="round" stroke-linejoin="round" [attr.d]="isOpen ? 'M5 15l7-7 7 7' : 'M19 9l-7 7-7-7'" />
      </svg>
    </div>

    <!-- Search input when search is enabled and dropdown is open -->
    <input *ngIf="enableSearch && isOpen" type="text" class="pe-3 py-2 w-full h-full rounded-md outline-none border border-transparent text-xs"
      #searchInput [(ngModel)]="searchQuery" (input)="onSearch()" (ngModelChange)="filterItems()"
      placeholder="Search..." (click)="$event.stopPropagation()" />

  </div>


  <!-- Dropdown Menu -->
  <ng-template #menu>
    <div
      class="bg-white border border-border my-2 rounded shadow-surround max-h-60 overflow-y-auto px-0"
      [ngClass]="{'animate-slide-down':this.placement == 'bottom',
        'animate-slide-up':this.placement == 'top'
      }"
      [style.width.px]="menuWidth">
      <!-- Search Bar -->
      <!-- <div *ngIf="enableSearch" class="sticky top-0 bg-white py-2 z-10">
        <app-input type="text" innerClass="py-2" class="h-4" [(ngModel)]="searchQuery" (ngModelChange)="filterItems()"
          placeholder="Search...">
        </app-input>
      </div> -->

      <!-- Content Projection -->
      <div class="flex flex-col gap-y-1">
        <div *ngIf="loading" class="flex flex-col gap-2 pb-1">
          <!-- <app-skeleton class="w-full rounded h-6"></app-skeleton>
          <app-skeleton class="w-full rounded h-6"></app-skeleton> -->
          <app-select-item [disabled]="true">Loading...</app-select-item>
        </div>
        <div *ngIf="!loading && !items.length" class="flex flex-col gap-2">
          <app-select-item [disabled]="true">No items found</app-select-item>
        </div>
        <ng-content *ngIf="!loading"></ng-content>
      </div>
    </div>
  </ng-template>
</div>
