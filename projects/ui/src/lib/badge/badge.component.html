<div class="relative flex items-center justify-center">
    <!-- Wrapper Mode -->
    <div *ngIf="isWrapper" class="relative">
      <!-- Wrapped Content -->
      <ng-content select="[badge-content]"></ng-content>
  
      <!-- Positioned Badge -->
      <span
        class="absolute top-0 right-0 -translate-y-1/2 translate-x-1/2 flex items-center justify-center h-6 w-6 text-xs font-medium text-white rounded-full shadow"
        [ngClass]="{
          'bg-lime-500': variant === 'success',
          'bg-yellow-500': variant === 'warning',
          'bg-red-500': variant === 'error',
          'bg-gray-500': variant === 'neutral',
          'bg-cyan-600': variant === 'info',
          'bg-primary': variant === 'primary',
        }"
      >
        <!-- Badge Text -->
        {{ text }}
      </span>
    </div>
  
    <!-- Standalone Mode -->
    <div
      *ngIf="!isWrapper"
      class="flex items-center justify-center w-fit px-2 py-1 font-medium rounded transition-all duration-300"
      [ngClass]="{
        'bg-lime-200 text-lime-700 hover:bg-lime-200': variant === 'success',
        'bg-yellow-100 text-yellow-800 hover:bg-yellow-200': variant === 'warning',
        'bg-red-100 text-red-800 hover:bg-red-200': variant === 'error',
        'bg-gray-100 text-gray-800 hover:bg-gray-200': variant === 'neutral',
        'bg-cyan-100 text-cyan-800 hover:bg-cyan-200': variant === 'info',
        'bg-primary text-primary-foreground hover:bg-primary/90': variant === 'primary',
        'px-2 py-0.5 text-[11px]': size === 'xs',
        'px-2.5 py-0.5 text-xs': size === 'sm',
        'px-3 py-1 text-sm': size === 'md',
        'px-4 py-1.5 text-base': size === 'lg'
      }"
    >
      <!-- Optional Leading Icon -->
      <ng-content select="[badge-icon]"></ng-content>
  
      <!-- Badge Text -->
        <ng-content></ng-content>
  
      <!-- Optional Close Button -->
      <button
        *ngIf="closable"
        class="ml-2 text-gray-500 hover:text-gray-700 focus:outline-none"
        (click)="closeBadge($event)"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
