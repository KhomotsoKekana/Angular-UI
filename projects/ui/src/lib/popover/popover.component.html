<div class="relative">
    <!-- Trigger -->
    <div *ngIf="!this.triggerId" #trigger (click)="isOpen !== undefined ? null : togglePopover()"
        [ngClass]="{ 'opacity-50 pointer-events-none': disabled }">
        <ng-content select="app-popover-trigger"></ng-content>
    </div>

    <!-- Popover Content -->
    <ng-template #content>
        <div class="bg-card/90 min-h-0 overflow-hidden border border-border backdrop-blur-xl rounded-md shadow-surround transition-all duration-200 m-1 animate-slide-down"
            [style.min-width.px]="popoverWidth">
            <!-- Arrow -->
            <div class="absolute w-2 h-2 bg-inherit transform rotate-45 border-t border-l" [ngClass]="arrowClasses"
                [style.backgroundColor]="bgColor" *ngIf="showArrow"></div>
            <!-- Animated Wrapper -->
            <span class="hover:text-primary absolute right-3 top-3 cursor-pointer" (click)="togglePopover()"><app-icon
                    *ngIf="showCloseButton" icon="x" class="h-5 w-5 "></app-icon></span>
            <ng-content select="app-popover-content"></ng-content>
        </div>
    </ng-template>



</div>
