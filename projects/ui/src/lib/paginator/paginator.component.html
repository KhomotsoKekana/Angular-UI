<div class="flex items-center justify-between w-full px-4 py-2 ">
    <!-- Rows per page -->
    <div class="flex items-center gap-x-3">
        <span class="text-xs text-muted-foreground">Rows per page</span>
        <select [value]="pageSize" (change)="onPageSizeChange($event)"
                class="pl-2 pr-8 py-1 text-sm bg-transparent border-0 cursor-pointer focus:ring-0 text-foreground">
            <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
        </select>
    </div>

    <!-- Navigation Controls -->
    <div class="flex items-center gap-x-1">
        <!-- Page Info -->
        <div class="px-4 text-xs text-muted-foreground font-medium flex items-center gap-x-1">
            <span>Page {{ pageIndex + 1 }} of {{ totalPages }}</span>
            <span class="text-muted-foreground">•</span>
            <span class="text-muted-foreground">{{ totalItems | number }} items</span>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex items-center">
            <button (click)="firstPage()"
                    [disabled]="pageIndex === 0"
                    class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
                    title="First page">
                <flex-icon icon="chevronDoubleLeft" class="h-4 w-4"></flex-icon>
            </button>

            <button (click)="previousPage()"
                    [disabled]="pageIndex === 0"
                    class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
                    title="Previous page">
                <flex-icon icon="chevronLeft" class="h-4 w-4"></flex-icon>
            </button>

            <button (click)="nextPage()"
                    [disabled]="pageIndex === totalPages - 1"
                    class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
                    title="Next page">
                <flex-icon icon="chevronRight" class="h-4 w-4"></flex-icon>
            </button>

            <button (click)="lastPage()"
                    [disabled]="pageIndex === totalPages - 1"
                    class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
                    title="Last page">
                <flex-icon icon="chevronDoubleRight" class="h-4 w-4"></flex-icon>
            </button>
        </div>
    </div>
</div>
