<div class="w-full bg-blue-50 p-2"> 
  <nav class="flex items-center text-gray-600 text-base" aria-label="breadcrumb">
    <ol class="flex flex-wrap items-center space-x-2">
      <li *ngFor="let item of items; let last = last" class="flex items-center" [class.text-gray-900]="last">
        <ng-container>
          <a *ngIf="!last && item.url" [href]="item.url" class="flex items-center hover:underline">
            <flex-icon *ngIf="item.icon" [icon]="item.icon" class="w-4 h-4 mr-1"></flex-icon>
            <span *ngIf="item.label">{{ item.label }}</span>
          </a>

          <span *ngIf="last || !item.url" class="flex items-center">
            <flex-icon *ngIf="item.icon" [icon]="item.icon" class="w-4 h-4 mr-1"></flex-icon>
            <span *ngIf="item.label">{{ item.label }}</span>
          </span>
        </ng-container>

        <span *ngIf="!last" class="mx-2 text-gray-400">›</span>
      </li>
    </ol>
  </nav>
</div>
