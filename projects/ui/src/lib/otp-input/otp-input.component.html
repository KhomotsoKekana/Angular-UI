<div [ngClass]="className" [class]="'grid grid-cols-' + this.length + ' text-center'">
  <div *ngFor="let value of otpValues; let i = index; trackBy: trackByIndex" class="relative">
    <input #otpInput [disabled]="disabled" maxlength="1" type="text" [id]="'otp-' + i" [value]="otpValues[i]"
      [placeholder]="placeholder"
      class="h-14 w-14 border text-center rounded-lg bg-gray-100 focus:outline-none focus:border-none focus:ring-primary focus:ring-2 transition-all duration-100 ease-in-out"
      (input)="onInput($event, i)" (keydown)="onKeydown($event, i)" />
  </div>
</div>
