<div class="sm:flex flex-col hidden bg-card border-border border-r transition-all duration-300 relative h-full z-40"
  [style]="'width:' + getCurrentWidth() + 'px'">
  <!-- Sidebar Content -->
  <div class="flex-grow py-3 px-2 relative">
    <nav class="h-full relative flex flex-col justify-between">
      <div>
        <ul class="gap-y-1 flex flex-col h-full">
          <li *ngFor="let item of navMain">
            <flex-button [disabled]="disabled" tooltipPosition="right" [appTooltip]="item.title | translate"
              tooltipVariant="primary" *ngIf="item.position != 'bottom' && !item.hidden"
              [variant]="item.isActive ? 'primaryGhost' : 'ghost'" [routerLink]="item.url"
              class="flex items-center w-full h-10 p-2 gap-x-4" [ngClass]="{ 'justify-center': collapsed}">
              <app-icon icon={{item.icon}} class="h-6 w-6" />
              <span *ngIf="!collapsed" class="text-sm">{{ item.title | translate}}</span>
              <span *ngIf="item.badge && item.badge > 0" class="absolute -top-1 -right-2 bg-red-600 text-white text-[9px] px-1 h-4 w-4 flex items-center justify-center py-1 rounded-full">
                {{ item.badge }}
              </span>
            </flex-button>
          </li>
        </ul>
      </div>
      <div>
        <ul class="gap-y-1 flex flex-col h-full">
          <li *ngFor="let item of navMain">
            <flex-button [disabled]="disabled" *ngIf="item.position == 'bottom' && !item.hidden" tooltipPosition="right"
              [appTooltip]="item.title | translate" tooltipVariant="primary" [routerLink]="item.url"
              class="flex items-center w-full h-10 p-2 gap-x-4"
              [variant]="item.isActive ? 'primary' : 'ghost'" [ngClass]="{'justify-center': collapsed}">
              <app-icon icon={{item.icon}} class="h-6 w-6" />
              <span *ngIf="!collapsed" class="text-sm">{{ item.title | translate }}</span>
            </flex-button>
          </li>
        </ul>
      </div>
    </nav>
  </div>

  <!-- Sidebar Footer -->
  <div class="p-2 border-t flex items-center justify-center gap-x-2 overflow-hidden w-full relative">
    <flex-button tooltipPosition="right" [appTooltip]="'SIDEBAR.TOGGLE_SIDEBAR' | translate" tooltipVariant="primary"
      class="w-full flex items-center justify-center" variant="ghost" (click)="toggleSidebar()">
      <app-icon *ngIf="!collapsed" icon="layoutSidebarClose"></app-icon>
      <app-icon *ngIf="collapsed" icon="layoutSidebarExpand"></app-icon>
      <span *ngIf="!collapsed"
        class="text-sm font-medium transition-all ease-in-out animate-fade-in duration-500">{{'SIDEBAR.TOGGLE_SIDEBAR' |
        translate}}</span>
    </flex-button>
  </div>
</div>

<!-- Horizontal Navigation for small screens -->
<div
  class="flex sm:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 transition-all duration-300 z-50 h-9">
  <nav class="flex flex-row items-center justify-around w-full">
    <ng-container *ngFor="let item of navMain">
      <flex-button *ngIf="item.allowMobile && !item.hidden" [disabled]="disabled" tooltipPosition="top"
        [appTooltip]="item.title | translate" tooltipVariant="primary" [routerLink]="item.url"
        class="flex items-center justify-center w-full h-full rounded-none"
        [variant]="item.isActive ? 'primary' : 'ghost'">
        <app-icon [icon]="item.icon" class="h-4 w-4" />
        <!-- Optionally show text below the icon -->
        <span class="text-xs">{{ item.title | translate }}</span>
      </flex-button>
    </ng-container>
  </nav>
</div>
