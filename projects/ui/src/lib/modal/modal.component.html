<div class="fixed inset-0 z-[100] flex items-center justify-center  transition-opacity duration-300"
    [ngClass]="{
    'opacity-100 pointer-events-auto': isOpen,
    'opacity-0 pointer-events-none': !isOpen,
    'bg-gray-900/50': backdropVariant === 'dark',
    'bg-white/40': backdropVariant === 'light',
  }" (click)="closeOnBackdrop && allowClose ? closeModal() : null" role="dialog" aria-modal="true"
    [attr.aria-labelledby]="ariaLabelledBy">
    <!-- Modal Content -->
    <div [class]="finalModalClass"
        [ngClass]="{
      'translate-y-0 opacity-100 scale-100': isOpen,
      'translate-y-4 opacity-0 scale-95': !isOpen
    }" (click)="$event.stopPropagation()">
        <!-- Header Slot -->
        <ng-content select="[modal-header]"></ng-content>

        <!-- Body Slot with dynamic content container -->
        <div [class]="bodyClass">
            <ng-container *ngIf="!contentComponent">
                <ng-content></ng-content>
            </ng-container>
            <ng-container *ngIf="contentComponent" #dynamicContent></ng-container>
        </div>

        <!-- Footer Slot -->
        <ng-content select="[modal-footer]"></ng-content>

        <!-- Close Button -->
        <button *ngIf="showCloseButton && allowClose"
            class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 focus:outline-none" (click)="closeModal()">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
</div>
