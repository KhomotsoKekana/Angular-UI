<div class="p-6 space-y-8">
    <h1 class="text-xl font-semibold">Data Table Component</h1>
    <p class="mb-4">A powerful, feature-rich table component for displaying structured data with sorting, filtering, and
        pagination.</p>

    <h2 class="text-lg font-medium mb-2">Client-side Data Processing</h2>
    <flex-code-block code="
    <div class=&quot;mb-6 overflow-x-auto&quot;>
        <flex-data-table [data]=&quot;tableData&quot; [columns]=&quot;tableColumns&quot; [rowClickable]=&quot;true&quot;
            (rowClick)=&quot;onRowClick($event)&quot;>
        </flex-data-table>
    </div>
    ">
        <div preview>
            <div class="mb-6 overflow-x-auto">
                <flex-data-table [data]="tableData" [columns]="tableColumns" [rowClickable]="true"
                    (rowClick)="onRowClick($event)">
                </flex-data-table>
            </div>
        </div>
    </flex-code-block>
    <h2 class="text-lg font-medium mb-2">Server-side Data Processing</h2>
    <flex-code-block code="
    <div class=&quot;mb-6 overflow-x-auto&quot;>
        <flex-data-table [data]=&quot;serverData&quot; [columns]=&quot;tableColumns&quot; [isServerSide]=&quot;true&quot; [loading]=&quot;loading&quot;
            [totalItems]=&quot;totalItems&quot; [pageSize]=&quot;pageSize&quot; [pageIndex]=&quot;currentPage&quot;
            (pageChange)=&quot;onPageChange($event)&quot; (sortChange)=&quot;onSortChange($event)&quot;
            (filterChange)=&quot;onFilterChange($event)&quot;>
        </flex-data-table>
    </div>
    ">
        <div preview>
            <div class="mb-6 overflow-x-auto">
                <flex-data-table [data]="serverData" [columns]="tableColumns" [isServerSide]="true" [loading]="loading"
                    [totalItems]="totalItems" [pageSize]="pageSize" [pageIndex]="currentPage"
                    (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)"
                    (filterChange)="onFilterChange($event)">
                </flex-data-table>
            </div>
        </div>
    </flex-code-block>
</div>
